name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install core + dev deps (no torch/PyG on CI — Phase 0 covers only core)
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]

      - name: Ruff lint
        run: ruff check cadence tests

      - name: Ruff format check
        run: ruff format --check cadence tests

      - name: Mypy
        run: mypy cadence
        continue-on-error: true  # types are advisory in Phase 0

      - name: Pytest (skip needs_dataset since Kaggle files aren't on CI)
        run: pytest -m "not needs_dataset and not gpu and not slow" --cov=cadence --cov-report=term-missing

      - name: CLI smoke — config-show works
        run: cadence config-show -c configs/ci.yaml
