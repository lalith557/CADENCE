name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install core + dev deps (no torch/PyG on CI — those are per-job)
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]

      - name: Ruff lint
        run: ruff check cadence tests

      - name: Ruff format check
        run: ruff format --check cadence tests

      - name: Mypy
        # Type errors are still surfaced; drop `continue-on-error` once the
        # main code paths type-clean.
        run: mypy cadence || true

      - name: Pytest (skip needs_dataset since Kaggle files aren't on CI)
        run: pytest -m "not needs_dataset and not gpu and not slow" --cov=cadence --cov-report=term-missing

      - name: CLI smoke — config-show works
        run: cadence config-show -c configs/ci.yaml

      - name: CLI smoke — gpu-check runs (no GPU on CI → expect graceful exit)
        run: cadence gpu-check --matmul-seconds 0.1 || true

  docker-build:
    runs-on: ubuntu-latest
    needs: lint-and-test
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build API image (docker/Dockerfile)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: false
          load: true
          tags: cadence-api:ci

      - name: Build dashboard image (docker/Dockerfile.dashboard)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.dashboard
          push: false
          load: true
          tags: cadence-dashboard:ci

      - name: docker-compose config passes
        run: docker compose config --quiet

      - name: Package installs from a fresh venv
        run: |
          python -m venv .venv
          . .venv/bin/activate
          pip install --upgrade pip
          pip install -e .[dev]
          python -c "import cadence; print('cadence ok', cadence.__version__)"
