  #     context: .
  #     dockerfile: docker/Dockerfile
  #   image: cadence-api:local
  #   command: uvicorn cadence.api.server:app --host 0.0.0.0 --port 8000
  #   ports:
  #     - "8000:8000"
  #   depends_on:
  #     - mlflow
